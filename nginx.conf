server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Increase allowed upload size (prevent 413 Request Entity Too Large)
    client_max_body_size 100M;

    # Serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional proxy for API calls. By default this forwards to the host machine
    # so a backend running on the host (e.g. at http://localhost:8000) will be reachable.
    # If you run your API in another container, update the proxy_pass to that service.
    # Proxy API requests
    location /api/ {
        # This value will be substituted at container start by envsubst using the API_URL env var.
        # API_URL is the backend base (e.g. http://host.docker.internal:8000)
        # We forward to the backend's /api/ path.
        proxy_pass ${API_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Some frontend code may POST to /forecasts/... (same-origin). Proxy those to backend as well.
    {
        # preserve original request URI when proxying
        proxy_pass ${API_URL}$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
